<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chattify - Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <!-- Navbar -->
    <nav>
        <div class="logo">
            <img src="VaultChat_Logo.png" class="logo-img" alt="Chattify Logo">
            <span class="logo-text">Chattify</span>
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="login.html" class="btn-nav">Sign In</a>
        </div>
    </nav>

    <!-- Register Section -->
    <section class="auth-section">
        <div class="auth-card">

            <!-- Logo -->
            <div class="auth-logo">
                <img src="VaultChat_Logo.png" class="auth-logo-img" alt="Chattify">
            </div>

            <!-- Title -->
            <h1 class="auth-title">Create Account</h1>
            <p class="auth-subtitle">Join the encrypted network.</p>

            <!-- Avatar Upload -->
            <div class="avatar-upload">
                <div class="avatar-circle" id="avatarCircle">
                    <span class="avatar-icon">👤</span>
                    <img id="avatarPreview" src="" alt="" style="display:none;">
                </div>
                <div class="camera-btn" id="cameraBtn">📷</div>
                <input type="file" id="avatarInput" accept="image/*" style="display:none;">
            </div>

            <!-- Form -->
            <div class="auth-form">

                <!-- Full Name -->
                <div class="input-group">
                    <span class="input-icon">👤</span>
                    <input
                        type="text"
                        id="fullname"
                        placeholder="Full Name"
                        class="auth-input"
                    >
                </div>

                <!-- Email -->
                <div class="input-group">
                    <span class="input-icon">✉️</span>
                    <input
                        type="email"
                        id="email"
                        placeholder="Email Address"
                        class="auth-input"
                    >
                </div>

                <!-- Password -->
                <div class="input-group">
                    <span class="input-icon">🔒</span>
                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        class="auth-input"
                    >
                    <span class="eye-icon" id="togglePassword">👁️</span>
                </div>

                <!-- Confirm Password -->
                <div class="input-group">
                    <span class="input-icon">🔒</span>
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm Password"
                        class="auth-input"
                    >
                    <span class="eye-icon" id="toggleConfirmPassword">👁️</span>
                </div>

                <!-- Complete Signup Button -->
                <button class="btn-auth" id="registerBtn">
                    Complete Signup →
                </button>

                <!-- Terms -->
                <p class="terms-text">
                    By signing up you agree to our
                    <a href="#">Terms of Service</a> and
                    <a href="#">Privacy Policy.</a>
                </p>

                <!-- Login Link -->
                <p class="auth-switch">
                    Already have an account?
                    <a href="login.html">Sign In</a>
                </p>

            </div>
        </div>
    </section>

    <script>
        // Toggle password visibility
const togglePassword = document.getElementById('togglePassword');
const password = document.getElementById('password');

togglePassword.addEventListener('click', () => {
    if (password.type === 'password') {
        password.type = 'text';
        togglePassword.textContent = '🙈';
    } else {
        password.type = 'password';
        togglePassword.textContent = '👁️';
    }
});

// Toggle confirm password visibility
const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
const confirmPassword = document.getElementById('confirmPassword');

toggleConfirmPassword.addEventListener('click', () => {
    if (confirmPassword.type === 'password') {
        confirmPassword.type = 'text';
        toggleConfirmPassword.textContent = '🙈';
    } else {
        confirmPassword.type = 'password';
        toggleConfirmPassword.textContent = '👁️';
    }
});

// Avatar upload preview
const cameraBtn = document.getElementById('cameraBtn');
const avatarInput = document.getElementById('avatarInput');
const avatarPreview = document.getElementById('avatarPreview');
const avatarIcon = document.querySelector('.avatar-icon');

cameraBtn.addEventListener('click', () => {
    avatarInput.click();
});

avatarInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            avatarPreview.src = e.target.result;
            avatarPreview.style.display = 'block';
            avatarIcon.style.display = 'none';
        };
        reader.readAsDataURL(file);
    }
});

// Register button
const registerBtn = document.getElementById('registerBtn');
registerBtn.addEventListener('click', () => {
    const fullname = document.getElementById('fullname').value;
    const email = document.getElementById('email').value;
    const pass = document.getElementById('password').value;
    const confirmPass = document.getElementById('confirmPassword').value;

    // Validation
    if (fullname === '' || email === '' || pass === '' || confirmPass === '') {
        alert('Please fill in all fields!');
        return;
    }

    if (pass !== confirmPass) {
        alert('Passwords do not match!');
        return;
    }

    if (pass.length < 6) {
        alert('Password must be at least 6 characters!');
        return;
    }

    // Loading state
    registerBtn.textContent = 'Creating account...';
    registerBtn.disabled = true;

    // Simulate register - connect to your backend here
    setTimeout(() => {
        registerBtn.textContent = 'Complete Signup →';
        registerBtn.disabled = false;
        window.location.href = 'login.html';
    }, 1500);
});

// Input focus effects
document.querySelectorAll('.auth-input').forEach(input => {
    input.addEventListener('focus', () => {
        input.parentElement.style.filter = 'drop-shadow(0 0 8px rgba(0, 201, 167, 0.3))';
    });
    input.addEventListener('blur', () => {
        input.parentElement.style.filter = 'none';
    });
});
    </script>
</body>
</html>
