<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chattify - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <!-- Navbar -->
    <nav>
        <div class="logo">
            <img src="VaultChat_Logo.png" class="logo-img" alt="Chattify Logo">
            <span class="logo-text">Chattify</span>
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="register.html" class="btn-nav">Create Account</a>
        </div>
    </nav>

    <!-- Login Section -->
    <section class="auth-section">
        <div class="auth-card">

            <!-- Logo -->
            <div class="auth-logo">
                <img src="VaultChat_Logo.png" class="auth-logo-img" alt="Chattify">
            </div>

            <!-- Title -->
            <h1 class="auth-title">Chattify</h1>
            <p class="auth-subtitle">Secure, intimate conversations.</p>

            <!-- Form -->
            <div class="auth-form">

                <!-- Email -->
                <div class="input-group">
                    <span class="input-icon">✉️</span>
                    <input 
                        type="email" 
                        id="email"
                        placeholder="Email Address"
                        class="auth-input"
                    >
                </div>

                <!-- Password -->
                <div class="input-group">
                    <span class="input-icon">🔒</span>
                    <input 
                        type="password" 
                        id="password"
                        placeholder="Password"
                        class="auth-input"
                    >
                    <span class="eye-icon" id="togglePassword">👁️</span>
                </div>

                <!-- Forgot Password -->
                <div class="forgot-password">
                    <a href="#">Forgot password?</a>
                </div>

                <!-- Sign In Button -->
                <button class="btn-auth" id="loginBtn">
                    Sign In →
                </button>

                <!-- Divider -->
                <div class="divider">
                    <span>or</span>
                </div>

                <!-- Sign Up Link -->
                <p class="auth-switch">
                    Don't have an account? 
                    <a href="register.html">Sign Up</a>
                </p>

            </div>
        </div>
    </section>

    <script>
        // Toggle password visibility
const togglePassword = document.getElementById('togglePassword');
const password = document.getElementById('password');

togglePassword.addEventListener('click', () => {
    if (password.type === 'password') {
        password.type = 'text';
        togglePassword.textContent = '🙈';
    } else {
        password.type = 'password';
        togglePassword.textContent = '👁️';
    }
});

// Login button
const loginBtn = document.getElementById('loginBtn');
loginBtn.addEventListener('click', () => {
    const email = document.getElementById('email').value;
    const pass = document.getElementById('password').value;

    if (email === '' || pass === '') {
        alert('Please fill in all fields!');
        return;
    }

    // Loading state
    loginBtn.textContent = 'Signing in...';
    loginBtn.disabled = true;

    // Simulate login - connect to your backend here
    setTimeout(() => {
        loginBtn.textContent = 'Sign In →';
        loginBtn.disabled = false;
        window.location.href = 'chat.html';
    }, 1500);
});

// Input focus effects
document.querySelectorAll('.auth-input').forEach(input => {
    input.addEventListener('focus', () => {
        input.parentElement.style.filter = 'drop-shadow(0 0 8px rgba(0, 201, 167, 0.3))';
    });
    input.addEventListener('blur', () => {
        input.parentElement.style.filter = 'none';
    });
});
    </script>
</body>
</html>
